---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vestaboard
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vestaboard
  template:
    metadata:
      labels:
        app: vestaboard
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-pull
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: vestaboard
          image: immersiveroom.azurecr.io/immersive-room/vestaboard-mock:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
