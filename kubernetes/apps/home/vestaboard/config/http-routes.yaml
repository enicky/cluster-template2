---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vestaboard
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - vestaboard.gitlab.be
  rules:
    - backendRefs:
        - name: vestaboard
          port: 5000
