---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: avserver
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - avserver.gitlab.be
  rules:
    - backendRefs:
        - name: avserver
          port: 5002
