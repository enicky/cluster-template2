---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avserver
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: avserver
  template:
    metadata:
      labels:
        app: avserver
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-pull
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: avserver
          image: immersiveroom.azurecr.io/immersive-room/avserver-mock:20261110.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5002
              protocol: TCP
            - name: tcp
              containerPort: 9000
              protocol: TCP
          env:
            - name: TCP_HOST
              value: "0.0.0.0"
            - name: TCP_PORT
              value: "9000"
            - name: HTTP_PORT
              value: "5002"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
