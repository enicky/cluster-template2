---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jetson-dashboard
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - jetson.gitlab.be
  rules:
    - backendRefs:
        - name: jetson-agent
          port: 8005
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jetson-websocket
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - jetson-ws.gitlab.be
  rules:
    - backendRefs:
        - name: jetson-agent
          port: 9001
