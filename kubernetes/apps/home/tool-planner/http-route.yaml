---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tool-planner
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - toolplanner.gitlab.be
  rules:
    - backendRefs:
        - name: tool-planner-web
          port: 8080
