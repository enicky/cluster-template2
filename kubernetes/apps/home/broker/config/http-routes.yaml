---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: broker
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - broker.gitlab.be
  rules:
    - backendRefs:
        - name: broker
          port: 8765