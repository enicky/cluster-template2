---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-dashboard
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - web-dashboard.gitlab.be
  rules:
    - backendRefs:
        - name: web-dashboard
          port: 80
