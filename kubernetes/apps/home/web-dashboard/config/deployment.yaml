---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-dashboard
  template:
    metadata:
      labels:
        app: web-dashboard
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-pull
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: web-dashboard
          image: immersiveroom.azurecr.io/immersive-room/web-dashboard:20261109.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: runtime-config
          configMap:
            name: web-dashboard-runtime-config
