---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: display-mcp
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - display-mcp.gitlab.be
  rules:
    - backendRefs:
        - name: display-mcp
          port: 8002
