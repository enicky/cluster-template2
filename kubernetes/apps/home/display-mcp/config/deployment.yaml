---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: display-mcp
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: display-mcp
  template:
    metadata:
      labels:
        app: display-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-pull
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      containers:
        - name: display-mcp
          image: immersiveroom.azurecr.io/immersive-room/display-mcp:20261112.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: PORT
              value: "8002"
            - name: BROKER_URL
              value: ws://broker.home.svc.cluster.local:8765
            - name: MCP_ALLOWED_HOSTS
              value: display-mcp.gitlab.be
            - name: MCP_ALLOWED_ORIGINS
              value: https://web-dashboard.gitlab.be
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: display-mcp-secrets
                  key: MCP_TOKEN
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
