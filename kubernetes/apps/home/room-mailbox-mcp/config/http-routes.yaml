---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: room-mailbox-mcp
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - room-mailbox-mcp.gitlab.be
  rules:
    - backendRefs:
        - name: room-mailbox-mcp
          port: 8008
