---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vestaboard-mcp
  namespace: home
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - vestaboard-mcp.gitlab.be
  rules:
    - backendRefs:
        - name: vestaboard-mcp
          port: 8003
